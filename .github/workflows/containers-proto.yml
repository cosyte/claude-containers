name: containers-proto

# Prototype, not a gate: can a session run rootless podman under production's hardening plus a
# few named options? Builds the session image, adds podman in a throwaway stage
# (test/containers-proto/Dockerfile, never shipped), and runs test/containers-proto/run.sh,
# whose per-mode results table lands in the job summary and docs/containers-in-sessions.md.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/containers-proto.yml
      - test/containers-proto/**

permissions:
  contents: read

concurrency:
  group: containers-proto-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  proto:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Ubuntu 24.04 lets only AppArmor-profiled programs create user namespaces; the session
      # runs apparmor=unconfined, so the host restriction is lifted (a host setting, like the
      # owner's own host needs if it is Ubuntu 23.10 or later).
      - name: host allows unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - id: args
        name: build args (the Makefile's BUILD_ARGS)
        run: |
          {
            echo 'list<<EOF'
            env -i PATH="$PATH" make -s --no-print-directory \
              --eval 'ci-build-args: ; @printf "%s\n" $(subst --build-arg ,,$(BUILD_ARGS))' ci-build-args
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the session image (claude-code-box:ci)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: claude-code-box:ci
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=gha
      - name: add podman in a throwaway stage (claude-containers-proto:ci)
        run: docker build --builder default -t claude-containers-proto:ci --build-arg BASE=claude-code-box:ci test/containers-proto
      - name: run the modes
        run: IMAGE=claude-containers-proto:ci OUT="$RUNNER_TEMP/proto" test/containers-proto/run.sh
      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: containers-proto-results
          path: ${{ runner.temp }}/proto
