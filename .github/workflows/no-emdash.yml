name: Em-dash gate

# The brand rule (founder directive 2026-07-24) bans U+2014 outright across every
# Cosyte surface, and names commit messages explicitly. This repo violated it
# wholesale until 2026-07-30: 1,026 occurrences across 45 tracked files, plus the
# GitHub repo description. This gate exists so that cannot come back.
#
# TWO JOBS, AND ONLY ONE IS REQUIRED:
#
#   `no-emdash` scans the tracked files. The `ci-required-checks` ruleset requires
#   it by that name: rename it and every pull request waits on a context nothing
#   emits.
#
#   `no-emdash-messages` scans the PR title, body, and commit messages, and must
#   never be required: Dependabot pastes upstream release notes into a PR body,
#   dashes included, and a required check would block the bump on text nobody
#   here wrote. It still goes red on such a body, so edit the dash out before
#   merging: a squash merge makes the body part of the commit on main.
#
# WHY A SEPARATE WORKFLOW, and not jobs in ci.yml:
#
#   The messages job needs the `edited` activity type, which is not a default.
#   Without it a title or body edited after the last push is never re-checked, and
#   because this repo squash-merges, the PR title and body ARE the commit message
#   that lands on main. ci.yml's triggers drive the lint + the unit suites;
#   re-running all of that every time someone fixes a typo in a PR description is
#   a large cost for no extra safety.
#
#   Both jobs live here rather than moving the file scan into ci.yml: the file
#   scan is a checkout and one grep, so it costs nothing to re-run on `edited`, and
#   one file is one thing to read.
#
# Run it locally with `npm run check:no-emdash`, and check PR text with
# `bash scripts/check-no-emdash.sh --stdin "PR text"`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

# No concurrency group. A push and a PR edit can arrive together (Dependabot does
# both), and a run a group cancels, even a queued one under
# `cancel-in-progress: false`, can count as a failed `no-emdash` and block the
# merge until someone re-runs it. Each run takes seconds, so every one finishes.

permissions:
  contents: read

jobs:
  no-emdash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tracked files
        run: bash scripts/check-no-emdash.sh

  no-emdash-messages:
    # Pull requests only: on a push to main the message is already written, and
    # this job exists to stop it landing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the step below reads the PR's commit range, and the
          # default shallow clone does not contain the base commit.
          fetch-depth: 0

      # The rule names commit messages explicitly, and a squash merge composes its
      # message from the PR title, the PR body, and the branch commits, so all three
      # are checked.
      - name: Check PR title, body, and commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Collect first, scan second, and set the shell options here rather than
          # trust the runner's default: piping the collection straight into the
          # scanner would hide a failed `git log` behind a clean title and body, and
          # the gate would print OK over commits it never read. The title and body
          # arrive through env and are never interpolated into the script, so a PR
          # description cannot inject shell.
          set -euo pipefail
          {
            printf '%s\n' "$PR_TITLE"
            printf '%s\n' "$PR_BODY"
            git log --format=%B "$BASE_SHA..$HEAD_SHA"
          } > "$RUNNER_TEMP/pr-messages.txt"
          bash scripts/check-no-emdash.sh --stdin "the PR title, body, or commit messages" \
            < "$RUNNER_TEMP/pr-messages.txt"
