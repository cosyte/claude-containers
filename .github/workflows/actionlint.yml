name: actionlint

# Lints every workflow file with actionlint, and the shell in their `run:` steps through its
# shellcheck integration, on every pull request and push to main. Any finding fails the job.
#
# WHY A PINNED BINARY, and not reviewdog/action-actionlint: from v1.75.0 that action installs
# actionlint from a fork (kjanat/actionlint) with a `curl | bash`, not from rhysd/actionlint. Here
# the official release is downloaded at one version and checked against the SHA-256 written below,
# so a changed asset fails the job. Moving to a new version means changing both values together.
#
# shellcheck is preinstalled on the hosted runner. actionlint silently skips its shellcheck
# integration when shellcheck is absent, so the job refuses to run without it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint at the pinned version and checksum
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" --version
          shellcheck --version

      - name: actionlint over .github/workflows/
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no workflow file found under .github/workflows/"
            exit 1
          fi
          "${RUNNER_TEMP}/actionlint" -color "${files[@]}"
          echo "actionlint clean over ${#files[@]} workflow file(s)."
