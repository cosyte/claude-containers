name: ci

# Lint + unit tests: everything provable on a hosted runner. The image smoke test
# (make smoke) needs a full image build and stays a local/manual gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lint (bash -n over all shell entrypoints)
        run: make lint
      # One step: test/run-all.sh finds every suite by glob and runs them in parallel, so there
      # is no list here to drift from package.json. Its summary names each suite.
      - name: unit tests (npm test, every test/unit.sh and test/*-unit.sh in parallel)
        run: npm test
