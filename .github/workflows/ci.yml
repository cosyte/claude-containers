name: ci

# The gate (make gate-full: lint, em-dash scan, unit tests) on every PR. The image smoke test
# (test/smoke.sh) builds the image and runs it, so on a PR it only runs when an image-affecting
# path changes; it runs on every push to main, every nightly run and every manual
# (workflow_dispatch) run.
# No paths filter on the workflow or the job: `smoke` is a required check, and a skipped
# required check blocks the merge, so the job always runs and reports. Its first step
# (scripts/smoke-needed.sh) decides whether the image paths changed, and the heavy steps run
# only then: on a docs-only PR the job passes in seconds.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The nightly run, 05:29 UTC: off the hour, as GitHub delays scheduled runs on the hour.
    - cron: "29 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run (a smoke run is long); pushes to main all run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the linters at the mise.toml pins (shellcheck, hadolint)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # One step, the same target a session runs before it pushes: make lint, then the em-dash
      # scan of every tracked file, then test/run-all.sh, which finds every suite by glob and
      # runs them in parallel, so there is no list here to drift. Its summary names each suite.
      - name: "gate (make gate-full: lint, no-emdash file scan, unit tests)"
        run: make gate-full

  # No job-level `if:` and no `needs:`: the job runs on every event and always reports, so the
  # required `smoke` check is never skipped. Every step after the decision carries
  # `if: steps.changes.outputs.image == 'true'`.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Depth 2: on a PR, HEAD is the merge commit and its first parent is the base, so the
      # decision step can diff the two.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # true on a push, the nightly or a manual run; on a PR, true only when an image path
      # changed (the list is in the script). A git failure fails the job, never a silent skip.
      - id: changes
        name: image paths changed? (scripts/smoke-needed.sh)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          image="$(scripts/smoke-needed.sh "$EVENT")"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [[ "$image" != true ]]; then
            echo "No image path changed: the image build and test/smoke.sh are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The Makefile's BUILD_ARGS, read from the Makefile itself so the two never drift. A
      # clean environment, so a runner variable (PNPM_VERSION, say) cannot override a default.
      - id: args
        if: steps.changes.outputs.image == 'true'
        name: build args (the Makefile's BUILD_ARGS)
        run: |
          # The single quotes are deliberate: $(subst ...) is make syntax, expanded by make.
          # shellcheck disable=SC2016
          {
            echo 'list<<EOF'
            env -i PATH="$PATH" make -s --no-print-directory \
              --eval 'ci-build-args: ; @printf "%s\n" $(subst --build-arg ,,$(BUILD_ARGS))' ci-build-args
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.image == 'true'
      # Built once and loaded: smoke runs test/smoke.sh directly, not `make smoke`, whose
      # `build` prerequisite would build a second time on the runner's 14 GB disk.
      - name: build the image (claude-code-box:ci)
        if: steps.changes.outputs.image == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: claude-code-box:ci
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Ubuntu 23.10 and later let only AppArmor-profiled programs create user namespaces, and
      # a --containers session runs apparmor=unconfined: lift it on the runner (a host setting,
      # docs/containers-in-sessions.md), so smoke's section 19 runs, required, not skipped.
      - name: host allows unprivileged user namespaces (--containers)
        if: steps.changes.outputs.image == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Parts that need a GPU, routable IPv6 or a working firewall report SKIP, as on any host
      # without them.
      - name: smoke (test/smoke.sh against claude-code-box:ci)
        if: steps.changes.outputs.image == 'true'
        run: SMOKE_CONTAINERS=require IMAGE=claude-code-box:ci test/smoke.sh
