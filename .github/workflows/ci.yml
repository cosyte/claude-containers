name: ci

# Lint + unit tests on every PR. The image smoke test (test/smoke.sh) builds the image and
# runs it, so it only runs when an image-affecting path changes, and on every push to main.
# No workflow-level paths filter: a skipped `smoke` job (job-level `if:`) reports success, so
# it can be a required check without sitting Pending on a docs-only PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels its older run (a smoke run is long); pushes to main all run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the linters at the mise.toml pins (shellcheck, hadolint)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: lint (bash -n, shellcheck -S warning, hadolint)
        run: make lint
      # One step: test/run-all.sh finds every suite by glob and runs them in parallel, so there
      # is no list here to drift from package.json. Its summary names each suite.
      - name: unit tests (npm test, every test/unit.sh and test/*-unit.sh in parallel)
        run: npm test

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            image:
              - Dockerfile
              - sshd_config
              - bash_profile
              - entrypoint.sh
              - entrypoint.d/**
              - bin/**
              - claude-config/**
              - scripts/**
              - test/smoke.sh
              - Makefile
              - docker-compose.yml
              - .github/workflows/ci.yml

  smoke:
    needs: changes
    # A failed `changes` job runs smoke rather than skipping it: a skip would report success.
    if: >-
      !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.image == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Makefile's BUILD_ARGS, read from the Makefile itself so the two never drift. A
      # clean environment, so a runner variable (PNPM_VERSION, say) cannot override a default.
      - id: args
        name: build args (the Makefile's BUILD_ARGS)
        run: |
          {
            echo 'list<<EOF'
            env -i PATH="$PATH" make -s --no-print-directory \
              --eval 'ci-build-args: ; @printf "%s\n" $(subst --build-arg ,,$(BUILD_ARGS))' ci-build-args
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built once and loaded: smoke runs test/smoke.sh directly, not `make smoke`, whose
      # `build` prerequisite would build a second time on the runner's 14 GB disk.
      - name: build the image (claude-code-box:ci)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: claude-code-box:ci
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Parts that need a GPU, routable IPv6 or a working firewall report SKIP, as on any host
      # without them.
      - name: smoke (test/smoke.sh against claude-code-box:ci)
        run: IMAGE=claude-code-box:ci test/smoke.sh
