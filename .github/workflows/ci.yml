name: CI

# Runs the same checks CONTRIBUTING.md asks contributors to run locally, and
# validates that the production image builds. The smoke test
# (test/smoke.sh) is intentionally NOT run here: it needs a logged-in
# claude-auth volume (real OAuth), and the mobile-app / Remote-Control
# checks are manual by nature — see CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint + generator self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install hadolint
        run: |
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: make lint
        run: make lint

      # No Docker / gh / OAuth needed — pure generation-logic guard.
      - name: compose-gen self-test
        run: bash test/compose-gen.sh

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the host-arch image and loads it. The Dockerfile runs
      # `claude --version` during build, so this also verifies the pinned
      # Claude Code version installs cleanly.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: claude-code-box:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
