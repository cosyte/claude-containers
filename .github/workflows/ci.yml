name: ci

# Lint + unit tests — everything provable on a hosted runner. The on-host substrate proof
# (bin/claude-sysbox-verify) needs Sysbox on the machine and stays a fleet-host step; the
# image smoke test (make smoke) needs a full image build and stays a local/manual gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: lint (bash -n over all shell entrypoints)
        run: make lint
      - name: unit tests (version-floor refusal + warn-only runc posture)
        run: test/unit.sh
      - name: broker unit tests (deny-by-default validator + fixed template + substrate refusals)
        run: test/broker-unit.sh
      - name: sizing unit tests (K resolution + controller envelope + capacity refusals)
        run: test/sizing-unit.sh
      - name: worker-run unit tests (argv validation + umbrella/submodule checks + run-exactly-once)
        run: test/worker-run-unit.sh
      - name: reaper unit tests (exited/dead/created selection + spool-prune + fail-safe)
        run: test/reaper-unit.sh
      - name: disk unit tests (free-space floor + broker refusal + gc plan safety + fail-safe)
        run: test/disk-unit.sh
      - name: controller unit tests (K=1 byte-identical autopilot collapse + K>1 dispatch/lease/drain wiring)
        run: test/controller-unit.sh
      - name: fleet-view unit tests (per-worker spend attribution + host headroom + secret-free fail-safe)
        run: test/fleet-view-unit.sh
      - name: compose-gen unit tests (scenario .conf expansion + env layering + cross-stack port reservation)
        run: test/compose-gen-unit.sh
      - name: egress-packages unit tests (PKG-1 opt-in package-registry allowlist — additive, opt-in, leak-free)
        run: test/egress-packages-unit.sh
      - name: mise unit tests (PKG-2 baked toolchain provisioner — pinned install, shims on PATH, /workspace-only trust)
        run: test/mise-unit.sh
      - name: cache unit tests (PKG-3 shared tool cache — /cache relocation, fail-safe, idle-only re-fetchable trim, launch/compose mounts)
        run: test/cache-unit.sh
      - name: manifest hardening unit tests (PKG-5 — user-scoped ignore-scripts + mise lockfile baked into build; claude-deps-check pin linter)
        run: test/manifest-hardening-unit.sh
      - name: apt provision unit tests (PKG-4 — brokered curated worker apt; tier gate, curated-not-open, install-then-relock, empty/missing-manifest fail-safe)
        run: test/apt-provision-unit.sh
