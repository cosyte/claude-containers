name: ci

# The gate (make gate-full: lint, em-dash scan, unit tests) on every PR. The image smoke test
# (test/smoke.sh) builds the image and runs it, so on a PR it only runs when an image-affecting
# path changes; it runs on every push to main, every nightly run and every manual
# (workflow_dispatch) run.
# No workflow-level paths filter: a skipped `smoke` job (job-level `if:`) reports success, so
# it can be a required check without sitting Pending on a docs-only PR.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The nightly run, 05:29 UTC: off the hour, as GitHub delays scheduled runs on the hour.
    - cron: "29 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run (a smoke run is long); pushes to main all run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the linters at the mise.toml pins (shellcheck, hadolint)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      # One step, the same target the harness runs: make lint, then the em-dash scan of every
      # tracked file, then test/run-all.sh, which finds every suite by glob and runs them in
      # parallel, so there is no list here to drift. Its summary names each suite.
      - name: "gate (make gate-full: lint, no-emdash file scan, unit tests)"
        run: make gate-full

  # Only a PR or a push has a change set to filter: a nightly or manual run tests main as a
  # whole, so the filter is skipped there and smoke runs.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            image:
              - Dockerfile
              - sshd_config
              - bash_profile
              - entrypoint.sh
              - entrypoint.d/**
              - bin/**
              - claude-config/**
              - scripts/**
              - containers/**
              - test/smoke.sh
              - Makefile
              - docker-compose.yml
              - .github/workflows/ci.yml

  smoke:
    needs: changes
    # A failed `changes` job runs smoke rather than skipping it: a skip would report success.
    # Every run but a PR's (a push to main, the nightly, a manual run) runs smoke.
    if: >-
      !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.image == 'true' || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Makefile's BUILD_ARGS, read from the Makefile itself so the two never drift. A
      # clean environment, so a runner variable (PNPM_VERSION, say) cannot override a default.
      - id: args
        name: build args (the Makefile's BUILD_ARGS)
        run: |
          {
            echo 'list<<EOF'
            env -i PATH="$PATH" make -s --no-print-directory \
              --eval 'ci-build-args: ; @printf "%s\n" $(subst --build-arg ,,$(BUILD_ARGS))' ci-build-args
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built once and loaded: smoke runs test/smoke.sh directly, not `make smoke`, whose
      # `build` prerequisite would build a second time on the runner's 14 GB disk.
      - name: build the image (claude-code-box:ci)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: claude-code-box:ci
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Ubuntu 23.10 and later let only AppArmor-profiled programs create user namespaces, and
      # a --containers session runs apparmor=unconfined: lift it on the runner (a host setting,
      # docs/containers-in-sessions.md), so smoke's section 19 runs, required, not skipped.
      - name: host allows unprivileged user namespaces (--containers)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Parts that need a GPU, routable IPv6 or a working firewall report SKIP, as on any host
      # without them.
      - name: smoke (test/smoke.sh against claude-code-box:ci)
        run: SMOKE_CONTAINERS=require IMAGE=claude-code-box:ci test/smoke.sh
