name: PR title

# The pull request title must follow Conventional Commits: squash-merged, it is the
# commit that lands on main. The rule lives in the shared workflow in cosyte/.github,
# called at the published reference every Cosyte repository uses, never @main. Its
# one context is `pr-title / conventional-commits`.

on:
  pull_request:
    branches: [main]
    # `edited` is load-bearing: a title changed after the last push is the title that lands.
    types: [opened, synchronize, reopened, edited]

# No concurrency group. A push and a title edit can arrive together (Dependabot
# does both), and a run a group cancels, even a queued one under
# `cancel-in-progress: false`, can count as a failed check and block the merge
# until someone re-runs it. Each run takes seconds, so every one finishes and the
# newest result stands.

permissions:
  contents: read

jobs:
  pr-title:
    permissions:
      contents: read
    uses: cosyte/.github/.github/workflows/pr-title.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
