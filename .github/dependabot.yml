# Dependabot: only the two ecosystems this repo actually has.
#
# There is deliberately NO `npm` entry. package.json is a task-runner shim with
# zero dependencies, so an npm entry would watch nothing and imply coverage that
# does not exist.
#
# The Claude Code CLI version is NOT watched either: it is pinned as a Docker
# build arg / env default in several places at once (Dockerfile, Makefile,
# .env.example), which Dependabot cannot see, and `test/cli-version-unit.sh`
# enforces that those declarations agree. Bumping it is a deliberate act with a
# model-selection consequence: from CLI 2.1.219 the `opus` alias resolves to
# Opus 5, so the pin decides which model every session runs. Bump it by hand.
#
# Each ecosystem comes as one grouped pull request a week, and the cooldown waits a
# day after a release before proposing it (the org's Dependabot standard). Commit
# messages take the chore prefix and the dependency scope, so a Dependabot title is
# a Conventional Commits title and passes pr-title.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns: ['*']
    # From v1.75.0 reviewdog/action-actionlint installs actionlint from a fork with
    # `curl | bash`. actionlint.yml runs rhysd/actionlint's own release, checked by
    # SHA-256, so this action is never proposed here.
    ignore:
      - dependency-name: reviewdog/action-actionlint
      # The cosyte/.github reusable workflows are pinned to the commit of a published `workflows-*`
      # reference and move by hand, with every caller here, together (ST37). Left to Dependabot, a
      # commit pin with no version tag is offered the newest commit on cosyte/.github's main, which is
      # not a published reference.
      - dependency-name: "cosyte/.github*"
    commit-message:
      prefix: chore
      include: scope

  # The Dockerfile's two FROM lines, both a literal tag pinned by digest
  # (node:24-trixie-slim@sha256:..., ghcr.io/astral-sh/uv:X.Y.Z@sha256:...):
  # Dependabot bumps uv's version and both digests. Node majors are ignored, a
  # new LTS is a deliberate move made by hand. It never touches what is
  # installed inside the image (pnpm, mise, the Claude Code CLI).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      docker:
        patterns: ['*']
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
