# A --containers session has no systemd: cgroupfs, no per-container cgroups, a file event log.
[containers]
cgroups = "disabled"
# No kernel session keyring per container: keyctl is dropped from the seccomp profile
# (containers/seccomp.jq), so crun must not ask for a keyring it cannot create. Builds and
# composes do not need one.
keyring = false

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
